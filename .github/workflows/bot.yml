name: MRK Entertainment Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: mrk-entertainment-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        id: run_bot
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          MAX_POSTS_PER_DAY: "6"
          MAX_POSTS_PER_RUN: "1"
          MAX_ITEM_AGE_HOURS: "36"
        run: python bot.py

      - name: Save publication history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted.json state.json

          if git diff --cached --quiet; then
            echo "No history changes to save."
            exit 0
          fi

          git commit -m "Update MRK publication history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report bot result
        if: steps.run_bot.outcome == 'failure'
        run: |
          echo "Bot execution failed. Check the Run bot logs above."
          exit 1
